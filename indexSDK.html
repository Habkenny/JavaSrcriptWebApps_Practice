<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Intro to map components - Create a 2D map | Sample | ArcGIS Maps SDK for JavaScript 4.31</title>

  <style>
    html,
    body {
      background-color: var(--calcite-ui-foreground-2);
      
      width: 500px;
      height: 500px;
      margin-left: auto; 
      margin-right:auto;
    }
  </style>
  <!-- Load Calcite components from CDN -->
  <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css" />
  <script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>

  <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.31/"></script>

  <!-- Load Map components from CDN-->
  <script
    type="module"
    src="https://js.arcgis.com/map-components/4.31/arcgis-map-components.esm.js"
  ></script>
  </head>

  <body>
    <arcgis-map zoom="12" center="-82.712174, 41.429967"></arcgis-map>
    <script>
      // Get a reference to the map component
      const arcgisMap = document.querySelector("arcgis-map");

      // Listen for when the component is ready
      arcgisMap.addEventListener("arcgisViewReadyChange", (event) => {
        console.log('Map component is ready', event);
      });
    </script>
  </body>
</html>
